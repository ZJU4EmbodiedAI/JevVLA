[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevvla"
version = "0.1.0"
description = "Jev-inspired scalar energy adaptation for vision-language-action policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.urls]
Repository = "https://github.com/ZJU4EmbodiedAI/JevVLA"

[project.optional-dependencies]
jax = ["jax>=0.4.30", "flax>=0.10"]

[project.scripts]
jevvla = "jevvla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
